name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System library for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import the app
        run: python -c "import server.app"

      - name: Generate fixtures
        run: python tests/make_fixtures.py

      - name: Engine checks (layout, OCR, structure)
        run: python tests/check_engine.py
